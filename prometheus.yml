global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'iris'
    metrics_path: /api/monitor/metrics
    static_configs:
      - targets: 
        - 'host.docker.internal:28000'
    scheme: http
  - job_name: 'custom_iris_metrics'
    metrics_path: /custom/monitor/metrics
    static_configs:
      - targets:
          - 'host.docker.internal:28000'
    basic_auth:
      username: '_SYSTEM'
      password: 'SYS'

